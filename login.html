<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistem Informasi Sekolah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-box">
    <div class="login-logo">
      <img src="logo.png" alt="Logo" class="login-logo-img">
      <h1>Sistem Informasi Sekolah</h1>
      <p>Kabupaten Ende – NTT</p>
    </div>
    
    <div class="login-error" id="loginError">Username atau password salah!</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Masukkan NPSN atau 'admin'" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn btn-full">🔐 Masuk</button>
    </form>
  </div>
</div>

<div id="footer-container"></div>

<script src="script.js"></script>
</body>
</html>
